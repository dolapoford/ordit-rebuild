          - generic [ref=e27]: About OrditAI
        - heading "Audit is the one profession where the work has to be checkable." [level=1] [ref=e28]:
          - generic [ref=e29]: Audit is the one profession
          - generic [ref=e31]: where the work has to be checkable.
        - paragraph [ref=e33]: That is not a constraint we design around. It is the reason the product exists in the shape it does.
      - generic [ref=e35]:
        - generic [ref=e36]:
          - paragraph [ref=e37]: Why George prepares instead of decides
          - generic [ref=e38]:
            - paragraph [ref=e39]: An auditor signs an opinion and carries personal liability for it. When a file is questioned — by a regulator, a court, a client — the auditor has to show how every conclusion was reached and on what evidence. That is the job.
            - paragraph [ref=e40]: "Most AI tools are built the other way around: they produce an answer and ask you to trust it. In almost every other industry that trade is worth making. In audit it is worthless, because an answer you cannot defend is not an answer at all."
            - paragraph [ref=e41]: So we started from attribution rather than automation. Every piece of work George does is authored, timestamped, evidenced and reversible. He drafts. You decide. The file shows which of you did what, and it will still show it in three years when somebody asks.
